[platformio]
default_envs = seeed_xiao_esp32s3-pcb-portrait

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:tools/upload_preflight.py
lib_deps =
    moononournation/GFX Library for Arduino@1.5.6
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@6.21.5
build_src_filter =
    +<*>
build_flags =
    -I include
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE

# Legacy DevKitC portrait variant for the Waveshare 3.5-inch RPi LCD (F).
# The base esp32-s3-devkitc-1 environment remains available for landscape.
[env:esp32-s3-devkitc-1-portrait]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D JR_R1_UI_PORTRAIT=1

# Compile this environment when temporarily reconnecting the original BTT
# TFT35-SPI V2.1. The default environment uses the Waveshare profile selected
# in include/display_profile.h.
[env:esp32-s3-devkitc-1-btt]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D DISPLAY_PROFILE=1

# Temporary bench diagnostic for the Waveshare panel. It uses the normal
# Waveshare pin profile but cycles solid colours before LVGL starts.
[env:esp32-s3-devkitc-1-display-test]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D JR_R1_DISPLAY_DIAGNOSTIC=1

# Production PCB from Schematic PDF_[No Variations] (5): XIAO + K1/K2.
# XIAO is the active hardware; its portrait variant below is the default.
[env:seeed_xiao_esp32s3-pcb]
extends = env:esp32-s3-devkitc-1
board = seeed_xiao_esp32s3
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D JR_R1_XIAO_PCB=1

[env:seeed_xiao_esp32s3-pcb-portrait]
extends = env:seeed_xiao_esp32s3-pcb
build_flags =
    ${env:seeed_xiao_esp32s3-pcb.build_flags}
    -D JR_R1_UI_PORTRAIT=1
