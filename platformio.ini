[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.5.6
    lvgl/lvgl@8.4.0
build_src_filter =
    +<*>
    -<channel2_ui.cpp>
build_flags =
    -I include
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE

# Compile this environment when temporarily reconnecting the original BTT
# TFT35-SPI V2.1. The default environment uses the Waveshare profile selected
# in include/display_profile.h.
[env:esp32-s3-devkitc-1-btt]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D DISPLAY_PROFILE=1
