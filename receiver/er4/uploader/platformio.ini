[platformio]
default_envs = er4-esc-rf-bench-wifi

[env:er4-esc-rf-bench-wifi]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
upload_protocol = custom
extra_scripts =
    pre:../../../tools/upload_preflight.py
    post:../upload_target.py

[env:er4-esc-direct-read-wifi]
extends = env:er4-esc-rf-bench-wifi
