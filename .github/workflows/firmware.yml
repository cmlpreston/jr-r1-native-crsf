name: R1 firmware and tests

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tools/systemd/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev ccache
          python -m pip install 'platformio==6.1.19'
      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ runner.arch }}-6.1.19-${{ hashFiles('platformio.ini') }}
      - name: Cache compiler results
        uses: actions/cache@v4
        with:
          path: .ccache
          # Unique save keys let each successful run extend the previous cache.
          key: ccache-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('platformio.ini', 'tools/ci_ccache.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('platformio.ini', 'tools/ci_ccache.py') }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Validate hardware configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.flash_via_pi import validate_hardware
          validate_hardware(Path.cwd(), 'seeed_xiao_esp32s3-pcb')
          PY
      - name: Build landscape firmware (one job)
        env:
          # PlatformIO appends this to the existing upload/identity preflight.
          # Local builds and downloaded-artifact uploads use platformio.ini.
          PLATFORMIO_EXTRA_SCRIPTS: |
            pre:tools/ci_ccache.py
        run: |
          mkdir -p ci-output
          set -o pipefail
          python - <<'PY'
          from platformio.project.config import ProjectConfig
          scripts = ProjectConfig.get_instance().get('env:seeed_xiao_esp32s3-pcb', 'extra_scripts')
          assert scripts == ['pre:tools/upload_preflight.py', 'pre:tools/ci_ccache.py'], scripts
          PY
          pio run -e seeed_xiao_esp32s3-pcb -j 1 2>&1 | tee ci-output/firmware-build.log
      - name: Run complete host suite (one job)
        run: |
          set -o pipefail
          make -C test -j1 CXX=/usr/lib/ccache/c++ CC=/usr/lib/ccache/cc run 2>&1 | tee ci-output/host-tests.log
      - name: Report compiler cache statistics
        if: always()
        run: |
          mkdir -p ci-output
          ccache --show-stats | tee ci-output/ccache.log
          {
            echo '### Compiler cache'
            echo '```text'
            cat ci-output/ccache.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package tested firmware
        run: python tools/package_ci_firmware.py
      - name: Save tested firmware
        uses: actions/upload-artifact@v4
        with:
          name: r1-landscape-${{ github.sha }}
          path: |
            ci-output/r1-upload.tar.gz
            ci-output/r1-upload-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Save committed source archive
        uses: actions/upload-artifact@v4
        with:
          name: r1-source-${{ github.sha }}
          path: |
            ci-output/source.tar.gz
            ci-output/r1-upload-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-output/*.log
          if-no-files-found: ignore
          retention-days: 3
