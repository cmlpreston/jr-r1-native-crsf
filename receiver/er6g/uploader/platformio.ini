[platformio]
default_envs = er6g-stock-teamrace-wifi

[env:er6g-stock-teamrace-wifi]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
upload_protocol = custom
extra_scripts =
    pre:../../../tools/upload_preflight.py
    post:../upload_target.py

[env:er6g-esc-listen-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-read-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-startup-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-mode-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-mode-startup-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-single-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-restore-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-restore-startup-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-write-wifi]
extends = env:er6g-stock-teamrace-wifi

[env:er6g-esc-write-startup-wifi]
extends = env:er6g-stock-teamrace-wifi
